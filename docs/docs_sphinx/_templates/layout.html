{%- extends "sphinx_rtd_theme/layout.html" %}

{# Disable RTD theme.js before it loads #}
<script>
window.SphinxRtdTheme = { Navigation: { enable: function(){} }, STMToggle: function(){} };
</script>

{# Custom meta #}
{%- block extrahead %}
{{ super() }}
{%- endblock %}

{# After page loads, strip inline styles from theme.js #}
{%- block footer %}
<script>
window.addEventListener('load', function() {
  var d = document;
  // Remove all inline style attributes from RTD elements
  var selectors = [
    '.wy-nav-side', '.wy-side-nav-search', '.wy-side-scroll',
    '.wy-nav-content-wrap', '.wy-nav-content',
    '.wy-menu-vertical li.current > a',
    '.wy-menu-vertical a', '.wy-menu-vertical header', '.wy-menu-vertical p.caption',
    '.wy-breadcrumbs', '.wy-breadcrumbs-aside', '.wy-breadcrumbs li',
    '.wy-nav-top', '.rst-content', '.rst-content h1', '.rst-content h2', '.rst-content h3', '.rst-content h4',
    '.rst-content p', '.rst-content a', '.rst-content li',
    'code', 'tt', 'pre',
    'table th', 'table td', 'table tr',
    'hr', 'blockquote', 'img',
    '.rst-footer-buttons', '.rst-footer-buttons a',
    '.admonition', '.note', '.warning', '.tip', '.hint', '.caution', '.danger', '.error', '.seealso', '.important',
    '.admonition-title', '.note > .admonition-title', '.warning > .admonition-title'
  ];
  for (var i = 0; i < selectors.length; i++) {
    var els = d.querySelectorAll(selectors[i]);
    for (var j = 0; j < els.length; j++) {
      els[j].removeAttribute('style');
    }
  }
  // Also remove from body
  d.body.removeAttribute('style');
  // Force light theme via JS to beat any remaining overrides
  var overrides = [
    ['body', 'background', '#ffffff'],
    ['body', 'color', '#2d3748'],
    ['.wy-nav-side', 'background', '#f8f9fb'],
    ['.wy-nav-side', 'color', '#2d3748'],
    ['.wy-side-nav-search', 'background', '#f8f9fb'],
    ['.wy-side-nav-search > a', 'color', '#1a202c'],
    ['.wy-menu-vertical li.current > a', 'background', 'rgba(37,99,235,0.08)'],
    ['.wy-menu-vertical li.current > a', 'color', '#2563eb'],
    ['.wy-menu-vertical a', 'color', '#2d3748'],
    ['.wy-menu-vertical a:hover', 'color', '#1a202c'],
    ['.wy-nav-content-wrap', 'background', '#ffffff'],
    ['.rst-content', 'color', '#2d3748'],
    ['.rst-content > h1', 'color', '#1a202c'],
    ['.rst-content h2', 'color', '#1a202c'],
    ['.rst-content > h1:first-child', 'border-bottom', '2px solid #e2e6ec'],
    ['.rst-content h2', 'border-bottom', '1px solid #e2e6ec'],
    ['.rst-content p', 'color', '#2d3748'],
    ['.rst-content a', 'color', '#2563eb'],
    ['code', 'color', '#e05544'],
    ['code', 'background', '#f6f8fa'],
    ['pre', 'background', '#f6f8fa'],
    ['pre', 'color', '#2d3748'],
    ['table th', 'background', '#f1f3f6'],
    ['table th', 'color', '#1a202c'],
    ['table td', 'color', '#2d3748'],
    ['hr', 'background', '#e2e6ec'],
    ['blockquote', 'background', '#f8f9fb'],
    ['blockquote', 'color', '#718096'],
    ['.wy-breadcrumbs', 'color', '#718096'],
    ['.wy-nav-top', 'background', '#f8f9fb']
  ];
  for (var i = 0; i < overrides.length; i++) {
    var el = d.querySelector(overrides[i][0]);
    if (el) el.style[overrides[i][1]] = overrides[i][2];
  }
});
</script>
{%- endblock %}
